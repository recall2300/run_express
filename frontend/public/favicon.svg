<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#000000"/>
  <!-- Train body -->
  <rect x="4" y="10" width="24" height="13" fill="none" stroke="#88eb46" stroke-width="1.5"/>
  <!-- Windows -->
  <rect x="7" y="13" width="5" height="4" fill="#88eb46" opacity="0.85"/>
  <rect x="14" y="13" width="5" height="4" fill="#88eb46" opacity="0.85"/>
  <!-- Front nose -->
  <rect x="21" y="13" width="5" height="4" fill="none" stroke="#88eb46" stroke-width="1"/>
  <!-- Wheels -->
  <circle cx="9" cy="24" r="2" fill="none" stroke="#88eb46" stroke-width="1.5"/>
  <circle cx="23" cy="24" r="2" fill="none" stroke="#88eb46" stroke-width="1.5"/>
  <!-- Rail -->
  <line x1="2" y1="27" x2="30" y2="27" stroke="#88eb46" stroke-width="1" opacity="0.45"/>
  <!-- Speed lines -->
  <line x1="4" y1="8" x2="14" y2="8" stroke="#88eb46" stroke-width="1" opacity="0.5"/>
  <line x1="2" y1="6" x2="10" y2="6" stroke="#88eb46" stroke-width="1" opacity="0.3"/>
</svg>